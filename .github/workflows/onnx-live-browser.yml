name: Live ONNX browser compatibility
on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/browser-onnx-smoke.mjs'
      - 'src/main.tsx'
      - 'src/components/**'
      - 'src/detection/**'
      - 'src/ai/patchcore.ts'
      - 'vite.config.ts'
      - '.github/workflows/onnx-live-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/vite.log; exit 1
      - name: Exercise actual PatchCore ONNX in Chromium
        run: node scripts/browser-onnx-smoke.mjs
